<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Card Layout</title>
<link rel="stylesheet" href="card-styles.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css"  rel="stylesheet" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap");

body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(to bottom, #2E3192 , #1BFFFF);
  }


.carousel-section {
  text-align: center;
  justify-content: center;
  justify-items: center;
  width: 100%; 
  margin: 0 auto;
  padding: 80px 20px; 
  padding-top: 90px;
  background-color: transparent;
  min-height: calc(100vh - 190px); 
  padding-bottom: 20px;
}
.card-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  padding: 10px; 
  background-color: transparent;
}

.card {
  flex: 1 1 calc(25% - 20px); 
  margin: 10px;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
  height: 200px;
  background-color: #fff;
  border-radius: 8px;
}

@media (max-width: 1200px) {
  .card {
      flex-basis: calc(33.33% - 20px); /* Each card takes up 33.33% of the container width on smaller screens */
  }
}

@media (max-width: 992px) {
  .card {
      flex-basis: calc(50% - 20px); /* Each card takes up 50% of the container width on even smaller screens */
  }
}

@media (max-width: 576px) {
  .card {
      flex-basis: calc(100% - 20px); /* Each card takes up 100% of the container width on the smallest screens */
  }
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.2);
}

.card-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.card h3 {
    color: black;
}

.navbar {
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }

  .card img {
    max-width: 100%;
    max-height: 150px; 
    object-fit: cover;
  }
  
  .botao {
    width: 125px;
    height: 45px;
    border-radius: 20px;
    border: none;
    box-shadow: 1px 1px rgba(107, 221, 215, 0.37);
    padding: 5px 10px;
    background: rgb(47,93,197);
    background: linear-gradient(160deg, rgba(47,93,197,1) 0%, rgba(46,86,194,1) 5%, rgba(47,93,197,1) 11%, rgba(59,190,230,1) 57%, rgba(0,212,255,1) 71%);
    color: #fff;
    font-family: Roboto, sans-serif;
    font-weight: 505;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    filter: drop-shadow(0 0 10px rgba(59, 190, 230, 0.568));
    transition: .5s linear;
  }
  
  .botao .mysvg {
    display: none;
  }
  
  .botao:hover {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    transition: .5s linear;
  }
  
  .botao:hover .texto {
    display: none;
  }
  
  .botao:hover .mysvg {
    display: inline;
  }
  
  .botao:hover::before {
    content: '';
    position: absolute;
    top: -3px;
    left: -3px;
    width: 100%;
    height: 100%;
    border: 3.5px solid transparent;
    border-top: 3.5px solid #fff;
    border-right: 3.5px solid #fff;
    border-radius: 50%;
    animation: animateC 2s linear infinite;
  }
  
  @keyframes animateC {
    0% {
      transform: rotate(0deg);
    }
  
    100% {
      transform: rotate(360deg);
    }
  }
  
  .butt{
    padding-top: 40px;
    padding-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="round-ball"></div>

    <nav class="navbar bg-blue-500 border-gray-200 dark:bg-gray-900">
        <div class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl p-4">
            <a class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="https://flowbite.com/docs/images/logo.svg" class="h-8" alt="Flowbite Logo" />
                <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">Faculty Apraisal Portal</span>
            </a>
            <div class="flex items-center space-x-6 rtl:space-x-reverse">
                <a action="/" method="POST" class="text-sm text-white hover:underline">Logout</a>
            </div>
        </div>
      </nav>
    
    
<div class="carousel-section">
  <div class="card-container" id="cardContainer">
    <!-- Cards will be dynamically added here -->
  </div>
  <form action="/download" method="GET">
 <div class="butt">
  <button class="botao" type="submit">
    <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="mysvg"><g id="SVGRepo_bgCarrier" stroke-width="0">
      </g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier">
         <g id="Interface / Download"> 
         <path id="Vector" d="M6 21H18M12 3V17M12 17L17 12M12 17L7 12" stroke="#f1f1f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         </path>
      </g> </g>
    </svg>
    
    <span class="texto">Download</span>
  </button>
</form>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
 
  const data = {
    results: 85,
    feedbacks: 15,
    national_conference: 2,
    international_conference: 1,
    national_journal: 1,
    international_journal: 2,
    ug_projects: 3,
    pg_projects: 2,
    phd_projects: 1,
    industry_projects: 1,
    consultancy: 2,
    organized_events: 4,
    attended_events: 3,
    administrative_duties: 'hod'
  };

  // Calculations
  const academic_marks = parseInt(data['results']) + parseInt(data['feedbacks']);
  const research_marks = (parseInt(data['national_conference']) * 2) + (parseInt(data['international_conference']) * 3) +
                         (parseInt(data['national_journal']) * 4) + (parseInt(data['international_journal']) * 6);
  const project_guidance_marks = (parseInt(data['ug_projects']) * 2) + (parseInt(data['pg_projects']) * 4) +
                                 (parseInt(data['phd_projects']) * 6);
  const industry_related_marks = (parseInt(data['industry_projects']) * 4) + (parseInt(data['consultancy']) * 4);
  const faculty_organized_events_marks = parseInt(data['organized_events']) * 3;
  const faculty_attended_events_marks = parseInt(data['attended_events']) * 4;

  let administrative_marks = 0;
  if (['hod', 'club_incharge', 'lab_incharge', 'time_table_incharge', 'bus_incharge',
      'hostel_duty', 'iso_iqac'].includes(data['administrative_duties'])) {
    administrative_marks = 5;
  }

  const total_marks = academic_marks + research_marks + project_guidance_marks + industry_related_marks +
                      faculty_organized_events_marks + faculty_attended_events_marks + administrative_marks;

  // Creating card HTML for each category
  const cardContainer = document.getElementById('cardContainer');
  const cardHTML = `
    <div class="card">
        <a href="templates/result.html" >
      <div class="card-body">
        <img src="static/performance.png" alt="Academic Marks Image">
        <h3>Academic Marks: {{acad}}</h3>
      </div type=submit>
    </div>
    <div class="card">
        <a href="templates/Publication.html" > 
      <div class="card-body">
        <img src="static/research.png" alt="Research Marks Image">
        <h3>Research Marks: {{pub}}</h3>
      </div>
    </div>
    <div class="card">
        <a href="templates/Guidence.html" > 
      <div class="card-body">
        <img src="static/guide.png" alt="Project Guidance Marks Image">
        <h3>Project Guidance Marks: {{gui}}</h3>
      </div>
    </div>
    <div class="card">
        <a href="templates/Industry.html"> 
      <div class="card-body">
        <img src="static/industry.png" alt="Industry Related Marks Image">
        <h3>Industry Related Marks: {{ind}}</h3>
      </div>
    </div>
    <div class="card">
        <a href="templates/events.html" > 
      <div class="card-body">
        <img src="static/events.png" alt="Faculty Organized Events Marks Image">
        <h3>Faculty Organized Events Marks:{{eve}} </h3>
      </div>
    </div>
    <div class="card">
        <a href="templates/facultyevents.html" > 
      <div class="card-body">
        <img src="static/learning.png" alt="Faculty Attended Events Marks Image">
        <h3>Faculty Attended Events Marks: {{aeve}}</h3>
      </div>
    </div>
    <div class="card">
        <a href="templates/adminduties.html"> 
      <div class="card-body">
        <img src="static/admin.png" alt="Administrative Marks Image">
        <h3>Administrative Marks: {{adm}}</h3>
      </div>
    </div>
    <div class="card">
      <a href="templates/result.html"> 
    <div class="card-body">
      <img src="static/resu.png" alt="Total  Marks Image">
      <h3>Total Marks: {{total}}</h3>
    </div>      
    </div>
    <div class="card">
      <a href="templates/details.html"> 
    <div class="card-body">
      <img src="static/resu.png" alt="Total  Marks Image">
      <h3>View Details</h3>
    </div>      
    </div>
  `;
  cardContainer.innerHTML = cardHTML;
});
</script>

</body>
</html>
